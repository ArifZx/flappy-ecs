<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://flappy.arifz.com/" />
    <meta
      name="description"
      content="Flappy ECS is a browser-based casual game built by Ariifz with an Entity Component System architecture for modern game-dev experimentation."
    />
    <meta name="author" content="Ariifz" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6ec6ff" />
    <meta name="application-name" content="Flappy ECS" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flappy.arifz.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Flappy ECS | Casual Game Dev by Ariifz" />
    <meta
      property="og:description"
      content="Play Flappy ECS, a lightweight browser game exploring casual game-dev with a modular Entity Component System architecture."
    />
    <meta property="og:image" content="https://flappy.arifz.com/logo.png" />
    <meta property="og:image:alt" content="Flappy ECS logo" />
    <meta property="og:site_name" content="Flappy ECS" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flappy ECS | Casual Game Dev by Ariifz" />
    <meta
      name="twitter:description"
      content="A browser-based Flappy game by Ariifz built with ECS for modern casual game-dev experiments."
    />
    <meta name="twitter:image" content="https://flappy.arifz.com/logo.png" />
    <meta name="twitter:image:alt" content="Flappy ECS logo" />
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Flappy ECS",
        "url": "https://flappy.arifz.com/",
        "description": "A browser-based casual game built with an Entity Component System for modern game-dev experimentation.",
        "genre": "Casual",
        "author": {
          "@type": "Person",
          "name": "Ariifz"
        },
        "creator": {
          "@type": "Person",
          "name": "Ariifz"
        },
        "applicationCategory": "Game",
        "operatingSystem": "Web Browser",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "image": "https://flappy.arifz.com/logo.png"
      }
    </script>
    <style>
      #lcp-poster {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      #lcp-poster img {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 225px;
        height: 225px;
        object-fit: contain;
      }

      #app {
        position: relative;
        z-index: 1;
      }
    </style>
    <title>Flappy ECS | Casual Game Dev by Ariifz</title>
  </head>
  <body>
    <picture id="lcp-poster" aria-hidden="true">
      <source srcset="/logo.webp" type="image/webp" />
      <img src="/logo.png" alt="" fetchpriority="high" decoding="async" />
    </picture>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
